name: Deploy Laravel Backend

on:
  push:
    branches: [ "production", "dev" ]

jobs:
  deploy:
    runs-on: self-hosted # Mengacu pada runner di VM Batam kamu

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment and PM2 Restart
        run: |
          # 1. Tentukan variabel berdasarkan branch
          if [ "${{ github.ref_name }}" == "production" ]; then
            APP_PATH="/var/www/wip-backend"
            PROCESS_NAME="laravel-prod"
            PORT=8000
          else
            APP_PATH="/var/www/wip-backend-dev"
            PROCESS_NAME="laravel-dev"
            PORT=8001
          fi

          echo "Starting deployment for $PROCESS_NAME in $APP_PATH"

          # 2. Masuk ke direktori project dan update kode
          cd $APP_PATH
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}

          # 3. Instalasi & Optimasi Laravel
          # Pastikan composer sudah terinstall di VM
          composer install --no-dev --optimize-autoloader

          # Jalankan migrasi database
          php artisan migrate --force

          # Bersihkan dan buat cache baru
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # 4. Fix Permissions (Penting agar tidak Error 500)
          chmod -R 775 storage bootstrap/cache
          
          # 5. Restart PM2
          # --cwd memastikan PM2 mencari vendor/autoload.php di folder project, bukan folder runner
          pm2 delete $PROCESS_NAME || true
          pm2 start "php artisan serve --port=$PORT --host=0.0.0.0" --name "$PROCESS_NAME" --cwd "$APP_PATH"
          pm2 save

          echo "🚀 Deployment successful for $PROCESS_NAME on port $PORT!"